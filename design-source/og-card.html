<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden;
         background: #111110;
         font-family: "DM Sans", sans-serif; color: #F8F8F6;
         display: flex; flex-direction: column; justify-content: space-between;
         padding: 66px 72px; }
  .mark { position: absolute; right: -90px; top: -70px; width: 520px; opacity: .06; }
  .eyebrow { display: flex; align-items: center; gap: 14px;
             font-size: 17px; font-weight: 700; letter-spacing: .22em;
             text-transform: uppercase; color: #AADA60; }
  .eyebrow::before { content: ""; width: 44px; height: 2px; background: currentColor; }
  h1 { font-family: "DM Serif Display", serif; font-weight: 400; font-size: 58px;
       line-height: 1.06; letter-spacing: -.02em; max-width: 17ch; }
  h1 em { color: #7DC114; font-style: italic; }
  .figure { display: flex; align-items: baseline; gap: 22px; align-items: flex-end; }
  .figure b { font-family: "DM Serif Display", serif; font-weight: 400;
              font-size: 78px; line-height: 1; color: #AADA60; letter-spacing: -.02em; }
  .figure span { font-size: 19px; line-height: 1.45; color: #C4C4BE; max-width: 22ch; }
  footer { display: flex; align-items: flex-end; justify-content: space-between; }
  footer img { height: 46px; }
  footer p { font-size: 18px; font-weight: 500; color: #888882; }
</style></head><body>
  <img class="mark" src="../public/assets/images/synchrony-mark.png">
  <div>
    <p class="eyebrow">Cost of vacancy calculator</p>
    <h1 style="margin-top:20px">What is your sales leadership vacancy <em>billing you?</em></h1>
  </div>
  <div class="figure">
    <b>$251,960</b>
    <span>What a $2M seat costs after six months open. Get your number in 60 seconds.</span>
  </div>
  <footer>
    <img src="../design-source/original-logos/synchrony-logo-updated.png">
    <p>emptyseatdiagnostic.com</p>
  </footer>
</body></html>
